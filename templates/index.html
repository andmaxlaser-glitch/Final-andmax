<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Láser - Andmax</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #111; text-align: center; }
        .upload-box { border: 2px dashed #007bff; padding: 30px; text-align: center; border-radius: 6px; background: #fafbfc; margin-bottom: 20px; cursor: pointer; }
        .upload-box:hover { background: #f0f4f8; }
        .form-group { margin: 15px 0; display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        select, input[type="number"] { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:hover { background: #0056b3; }
        .resultado-box { margin-top: 20px; background: #e9ecef; padding: 20px; border-radius: 5px; display: none; font-size: 16px; }
        .precio { font-size: 22px; color: #28a745; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cotizador de Corte Láser</h1>
        <p style="text-align: center;">Sube tu archivo DXF y selecciona el material para calcular tu presupuesto.</p>
        
        <form id="uploadForm">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <p>Haz clic aquí o arrastra tu archivo DXF</p>
                <input type="file" id="fileInput" name="archivo_dxf" accept=".dxf" style="display: none;">
                <span id="fileName" style="font-weight: bold; color: #007bff;"></span>
            </div>

            <div class="form-group">
                <div>
                    <label for="material"><b>Material:</b></label>
                    <select id="material" name="material">
                        <option value="MDF">MDF</option>
                        <option value="Acrilico">Acrílico</option>
                        <option value="Acero al carbono">Acero al carbono</option>
                        <option value="Acero inoxidable">Acero inoxidable</option>
                        <option value="Aluminio">Aluminio</option>
                    </select>
                </div>
                <div>
                    <label for="espesor"><b>Espesor (mm):</b></label>
                    <input type="number" id="espesor" name="espesor" min="1" max="12" value="1" style="width: 70px;">
                </div>
            </div>

            <button type="submit">Calcular Cotización</button>
        </form>

        <div id="resultadoBox" class="resultado-box">
            <h3>Resultado del Análisis:</h3>
            <p id="infoTexto"></p>
            <div id="precioTexto" class="precio"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameSpan = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const resultadoBox = document.getElementById('resultadoBox');
        const infoTexto = document.getElementById('infoTexto');
        const precioTexto = document.getElementById('precioTexto');

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameSpan.textContent = `Archivo seleccionado: ${fileInput.files[0].name}`;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (fileInput.files.length === 0) {
                alert('Selecciona un archivo DXF primero.');
                return;
            }

            const formData = new FormData();
            formData.append('archivo_dxf', fileInput.files[0]);
            formData.append('material', document.getElementById('material').value);
            formData.append('espesor', document.getElementById('espesor').value);

            infoTexto.textContent = 'Analizando pieza y calculando costos...';
            precioTexto.textContent = '';
            resultadoBox.style.display = 'block';

            try {
                const response = await fetch('/analizar', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.estado === 'exito') {
                    infoTexto.innerHTML = `
                        <b>Líneas:</b> ${data.conteo_elementos.lineas} | 
                        <b>Círculos:</b> ${data.conteo_elementos.circulos} | 
                        <b>Arcos:</b> ${data.conteo_elementos.arcos}<br>
                        <b>Perímetro Total de Corte:</b> ${data.perimetro_total_mm} mm<br>
                        <b>Material:</b> ${data.material} (${data.espesor} mm)
                    `;
                    precioTexto.innerHTML = `Precio Estimado: $${data.precio_total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
                } else {
                    infoTexto.textContent = `Error: ${data.mensaje}`;
                    precioTexto.textContent = '';
                }
            } catch (error) {
                infoTexto.textContent = 'Ocurrió un error al procesar la solicitud.';
            }
        });
    </script>
</body>
</html>
<!-- Agrega esto en tu formulario, justo debajo del espesor -->
<div class="form-group">
    <div>
        <label><b>Ancho (cm):</b></label>
        <input type="number" id="ancho" name="ancho" value="10" style="width: 60px;">
    </div>
    <div>
        <label><b>Alto (cm):</b></label>
        <input type="number" id="alto" name="alto" value="10" style="width: 60px;">
    </div>
</div>
